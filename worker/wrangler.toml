name = "zor-proxy-worker"
main = "src/index.ts"
compatibility_date = "2026-08-30"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "SESSIONS"
id = "a7462b9e44c241fe830333d45cb1954c"

# Starkscan prover: STARKSCAN_API_KEY must be set as a Worker secret, never in vars:
#   wrangler secret put STARKSCAN_API_KEY
# Daily budget caps proofs/day per key (UTC midnight reset); default 100.
[vars]
STARKNET_RPC_URL = "https://starknet-mainnet.g.alchemy.com/v0_3"
CHAIN_ID = "0x534e5f4d41494e"
STRK20_CONTRACT_ADDRESS = "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d"
PROXY_WALLET_ADDRESS = "0x6bac485e95d541c9d3e5bed098b47d137143a6a9e51d62b4e3ba31249d9700bd"
PRICE_PER_MINUTE = "0.001"
ALLOWED_ORIGIN = "*"
PROVING_SERVICE_URL = ""
STARKSCAN_DAILY_BUDGET = "100"
AVNU_PUBLIC_KEY = "0x5f554ea1e957e7c0583048f07978d6a9f75896650c4e7a38899fc6ad877c9ce"
AVNU_API_KEY = "198c9cb1-6b0c-4788-bed3-b5672a914294"
AVNU_PAYMASTER_URL = "https://paymaster.avnu.fi"

[env.production]
vars = { STARKNET_RPC_URL = "https://starknet-mainnet.g.alchemy.com/v0_3", CHAIN_ID = "0x534e5f4d41494e", STRK20_CONTRACT_ADDRESS = "0x04718f5a0fc34cc1af16a1cdee98ffb20c31f5cd61d6ab07201858f4287c938d", PROXY_WALLET_ADDRESS = "0x6bac485e95d541c9d3e5bed098b47d137143a6a9e51d62b4e3ba31249d9700bd", PRICE_PER_MINUTE = "0.001", ALLOWED_ORIGIN = "https://zor-frontend.pages.dev", PROVING_SERVICE_URL = "https://zor-prover.fly.dev", STARKSCAN_DAILY_BUDGET = "100", AVNU_PUBLIC_KEY = "0x5f554ea1e957e7c0583048f07978d6a9f75896650c4e7a38899fc6ad877c9ce", AVNU_API_KEY = "198c9cb1-6b0c-4788-bed3-b5672a914294", AVNU_PAYMASTER_URL = "https://paymaster.avnu.fi" }

[[env.production.kv_namespaces]]
